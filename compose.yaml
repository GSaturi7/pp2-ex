services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - biblioteca-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  biblioteca-data:
